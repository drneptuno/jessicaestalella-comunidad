name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # No bloqueante por ahora: hay deuda de dependencias anotada en el backlog
      # del ecosistema. Pasar a bloqueante cuando esté saldada.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true
